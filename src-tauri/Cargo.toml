[package]
name = "lakuensuite"
version = "0.1.0"
description = "LakuenSuite – alle Lakuen-Apps installieren, aktualisieren und starten"
authors = ["Dominic Lesina"]
edition = "2021"
rust-version = "1.77"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", default-features = false, features = ["json", "stream", "rustls-tls", "http2"] }
tokio = { version = "1", features = ["fs", "io-util", "time"] }
futures-util = "0.3"
sha2 = "0.10"
base64 = "0.22"
dirs = "6"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
strip = true
panic = "abort"
