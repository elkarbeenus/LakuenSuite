name: Build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  appimage:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: System-Pakete
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev patchelf libssl-dev libxdo-dev file

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - uses: actions/setup-node@v5
        with:
          node-version: 20

      - name: Version bestimmen
        run: echo "LAKUEN_DESCRIBE=$(git describe --tags --long --always --match 'v*')" >> "$GITHUB_ENV"

      - name: Tests
        run: |
          set -o pipefail
          cargo test --manifest-path src-tauri/Cargo.toml 2>&1 | tee -a build.log

      - name: AppImage bauen
        run: |
          set -o pipefail
          npm install 2>&1 | tee -a build.log
          npx tauri build --bundles appimage 2>&1 | tee -a build.log

      - name: Umbenennen und Prüfsumme
        run: |
          mkdir -p out
          src=$(ls src-tauri/target/release/bundle/appimage/*.AppImage | head -n1)
          cp "$src" out/LakuenSuite-x86_64.AppImage
          cd out
          sha256sum LakuenSuite-x86_64.AppImage > LakuenSuite-x86_64.AppImage.sha256
          cat LakuenSuite-x86_64.AppImage.sha256

      - uses: actions/upload-artifact@v4
        with:
          name: LakuenSuite-${{ env.LAKUEN_DESCRIBE }}
          path: out/*

      # Fehlerprotokoll in einen eigenen Zweig legen, damit es auch ohne Actions-Zugriff lesbar ist.
      - name: Fehlerprotokoll sichern
        if: failure() && github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          mkdir -p /tmp/log && cp build.log /tmp/log/build.log 2>/dev/null || echo "kein Log" > /tmp/log/build.log
          cd /tmp/log
          git init -q -b ci-log
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          echo "${GITHUB_SHA}" > commit.txt
          git add . && git commit -qm "CI-Log für ${GITHUB_SHA}"
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${GITHUB_REPOSITORY}.git" ci-log

      - name: Release veröffentlichen
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          name: LakuenSuite ${{ github.ref_name }}
          body_path: ${{ hashFiles(format('release-notes/{0}.md', github.ref_name)) != '' && format('release-notes/{0}.md', github.ref_name) || '' }}
          generate_release_notes: ${{ hashFiles(format('release-notes/{0}.md', github.ref_name)) == '' }}
          files: |
            out/LakuenSuite-x86_64.AppImage
            out/LakuenSuite-x86_64.AppImage.sha256
